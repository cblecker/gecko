description: |-
  PlatformRole is a cluster-scoped, system-managed role. PlatformRoles are
  seeded by Helm. Every authenticated user can discover their names and complete
  permission sets through the read-only public API.
properties:
  apiVersion:
    description: |-
      APIVersion defines the versioned schema of this representation of an object.
      Servers should convert recognized schemas to the latest internal value, and
      may reject unrecognized values.
      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
    type: string
  kind:
    description: |-
      Kind is a string value representing the REST resource this object represents.
      Servers may infer this from the endpoint the client submits requests to.
      Cannot be updated.
      In CamelCase.
      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
    type: string
  metadata:
    type: object
  spec:
    description: spec describes the permission set included in this platform role.
    properties:
      permissions:
        description: permissions is the complete set of permissions included in this
          role.
        items:
          type: string
        minItems: 1
        type: array
        x-kubernetes-list-type: set
    required:
    - permissions
    type: object
required:
- spec
type: object
