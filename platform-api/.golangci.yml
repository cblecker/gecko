version: "2"

run:
  allow-parallel-runners: true
  timeout: 5m

linters:
  enable:
    - dupword
    - durationcheck
    - errorlint
    - fatcontext
    - gocyclo
    - misspell
    - nilerr
    - noctx
    - unparam
    - usestdlibvars
    - errcheck
    - unused
    - kubeapilinter
    - geckoconventions
  settings:
    custom:
      geckoconventions:
        # Path is relative to the config file (platform-api/.golangci.yml).
        path: ../hack/tools/bin/gecko-conventions.so
        description: >
          geckoconventions enforces the platform API conventions documented in
          API-CONVENTIONS.md that are not covered by other linters:
          +required must not have omitempty; +immutable is forbidden;
          prefer standard markers over kubebuilder-specific equivalents;
          bool fields must not be named IsFoo; metav1.Time fields must end
          with "Time".
      kubeapilinter:
        # Path is relative to the config file (platform-api/.golangci.yml).
        path: ../hack/tools/bin/kube-api-linter.so
        description: >
          kubeapilinter lints Kubernetes-style API types based on API conventions
          and best practices. See sigs.k8s.io/kube-api-linter.
        settings:
          linters:
            enable:
              - arrayofstruct
              - conditions
              - defaultorrequired
              - defaults
              - duplicatemarkers
              - integers
              - jsontags
              - nobools
              - nodurations
              - nofloats
              - nomaps
              - nonullable
              - nophase
              - noreferences
              - notimestamp
              - optionalfields
              - optionalorrequired
              - requiredfields
              - ssatags
              - statussubresource
              - uniquemarkers
            # commentstart requires every field to have a godoc comment starting
            # with the JSON field name — valuable but requires a large separate
            # effort to fix across all existing types.
            disable:
              - commentstart
              # nonpointerstructs is designed for native Kubernetes types; not
              # applicable to CRD-based APIs.
              - nonpointerstructs
          lintersConfig:
            conditions:
              isFirstField: Warn
              # platform-api only serves CRDs, not proto-serialised native types.
              usePatchStrategy: Warn
              useProtobuf: Warn
            optionalfields:
              pointers:
                preference: WhenRequired
                policy: Warn
              omitEmpty:
                policy: Warn
            requiredfields:
              pointers:
                policy: Warn
              omitempty:
                policy: Warn
    gocyclo:
      min-complexity: 30
    govet:
      enable:
        - nilness
    misspell:
      locale: US
  exclusions:
    warn-unused: true
    generated: lax
    presets:
      - std-error-handling
    rules:
      # ── unused ────────────────────────────────────────────────────────────
      # localSchemeBuilder is a side-effect assignment in the scheme registration
      # pattern required by controller-runtime.
      - linters:
          - unused
        text: 'var localSchemeBuilder is unused'
      # ── kubeapilinter ────────────────────────────────────────────────────
      # arrayofstruct: NetworkingSpec.ClusterNetwork is an intentional
      # list-of-struct design where the struct members form a natural key/value
      # pair.
      - linters:
          - kubeapilinter
        text: 'arrayofstruct: NetworkingSpec\.ClusterNetwork is an array of structs'

      # TODO(kubeapilinter): Review and fix these linting errors.
      # These exceptions baseline findings that require non-trivial API changes
      # (pointer conversions, MinLength additions, omitzero tags, struct tags).
      # Each should be evaluated and either fixed or permanently excepted.

      # optionalfields: optional string fields without MinLength validation should
      # be pointers — fixing requires adding MinLength or converting to *string.
      - linters:
          - kubeapilinter
        text: 'optionalfields: field .* has a valid zero value'

      # optionalfields/requiredfields: struct fields need omitzero tag — a
      # separate effort as it requires regenerating the public API.
      - linters:
          - kubeapilinter
        text: '(optionalfields|requiredfields): field .* does not allow the zero value'

      # requiredfields: required struct fields should use omitzero — tracked separately.
      - linters:
          - kubeapilinter
        text: 'requiredfields: field .* (should have the omitempty tag|has a valid zero value)'

      # conditions: struct tag should include patchStrategy/patchMergeKey/protobuf.
      # These are servo-side-apply and protobuf annotations. Tracked separately.
      - linters:
          - kubeapilinter
        text: 'conditions: Conditions field .* has incorrect tags'
      # The authn/authz implementation structs are runtime plumbing, not
      # Kubernetes API objects. kubeapilinter otherwise treats their private
      # synchronization fields as serialized API fields.
      - linters:
          - kubeapilinter
        path: 'pkg/(authn|authz)/'

      # ── geckoconventions ─────────────────────────────────────────────────
      # TODO(geckoconventions): Review and fix these linting errors.
      # The findings below baseline pre-existing violations in the API types.
      # Each should be evaluated and fixed in a dedicated cleanup pass.
      # Exclusions are scoped to the specific files that contain existing
      # violations so that new violations in other files are still reported.
      # The affected files are: channel_types.go, cluster_types.go,
      # controlplane_upgrade_policy_types.go, nodepool_types.go,
      # platformrole_types.go, role_types.go, rolebinding_types.go,
      # version_types.go.

      # requirednoomitempty: +required fields with omitempty — the fix is to
      # remove omitempty from the JSON tag of every affected field.
      - linters:
          - geckoconventions
        text: 'required field must not have omitempty'
        path: 'api/private/v1/(cluster|nodepool)_types\.go'

      # preferstandardmarkers: kubebuilder:validation:ListType used instead of
      # the standard +listType marker. The pattern matches the value-inclusive
      # message form (e.g. "use +listType=atomic instead of +kubebuilder:...").
      - linters:
          - geckoconventions
        text: 'use \+listType'
        path: 'api/private/v1/cluster_types\.go'

      # scalarbounds: existing API fields missing scalar bound markers.
      # Fixing these requires adding MaxLength, Minimum/Maximum, MaxItems, or
      # MaxProperties to each affected field — a non-trivial effort that
      # requires agreeing on appropriate bound values for each field.
      - linters:
          - geckoconventions
        text: 'scalarbounds: (string|numeric|slice|map|.byte.) field is missing'
        path: 'api/private/v1/(channel|cluster|controlplane_upgrade_policy|nodepool|platformrole|role|rolebinding|version)_types\.go'

      # scalarbounds: pkg/authn and pkg/authz contain runtime plumbing structs,
      # not Kubernetes API objects — skip scalar bound checks there.
      - linters:
          - geckoconventions
        text: 'scalarbounds:'
        path: 'pkg/(authn|authz)/'

      # optionalhasomitempty: Items fields on list types are marked +optional
      # without omitempty. Kubernetes list types conventionally always include
      # items (even if empty), so omitempty should not be added; the correct
      # fix is to remove the +optional marker from Items on list types.
      - linters:
          - geckoconventions
        text: 'optional field must have omitempty'
        path: 'api/private/v1/(platformrole|role|rolebinding)_types\.go'
    paths:
      - api/public/

severity:
  default: error

formatters:
  enable:
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/openshift-online)
        - prefix(k8s.io)
        - prefix(sigs.k8s.io)
      custom-order: true
  exclusions:
    warn-unused: true
    generated: lax
