version: "2"

run:
  allow-parallel-runners: true
  timeout: 5m

linters:
  enable:
    - dupword
    - durationcheck
    - errorlint
    - fatcontext
    - gocyclo
    - misspell
    - nilerr
    - noctx
    - unparam
    - usestdlibvars
    - errcheck
    - unused
  settings:
    gocyclo:
      min-complexity: 30
    govet:
      enable:
        - nilness
    misspell:
      locale: US
  exclusions:
    warn-unused: true
    generated: lax
    presets:
      - std-error-handling
    rules:
      # Existing reconcile flows have complexity 32 and 43. Splitting their
      # state transitions requires a separate review of controller behavior.
      - linters:
          - gocyclo
        text: 'cyclomatic complexity 32 of func `\(\*Reconciler\)\.Reconcile` is high'
        path: '^hc/hc_controller\.go$'
      - linters:
          - gocyclo
        text: 'cyclomatic complexity 43 of func `\(\*Reconciler\)\.Reconcile` is high'
        path: '^nodepool/nodepool_controller\.go$'
      # Keep explicit cluster IDs in these test fixtures and request helpers
      # so each test describes the relationship between cluster and node pool.
      - linters:
          - unparam
        text: '(makeNP - clusterID|makeCluster - id|npReq - clusterID) always receives "cluster-1"'
        path: '^nodepoolvrresolution/nodepoolvrresolution_controller_test\.go$'
      - linters:
          - unparam
        text: 'makeNP - npID always receives "np-1"'
        path: '^nodepoolvrresolution/nodepoolvrresolution_controller_test\.go$'
      # SecretIterator.Next returns iterator.Done directly; this sentinel is
      # not wrapped by the Google client iterator.
      - linters:
          - errorlint
        text: 'comparing with == will fail on wrapped errors'
        path: '^placement/dynamic_selector\.go$'
        source: 'err == iterator\.Done'

severity:
  default: error

formatters:
  enable:
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/openshift-online)
        - prefix(k8s.io)
        - prefix(sigs.k8s.io)
      custom-order: true
  exclusions:
    warn-unused: true
    generated: lax
