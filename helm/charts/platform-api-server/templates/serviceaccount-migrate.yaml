{{- if and .Values.spanner.enabled .Values.spanner.migration.serviceAccount.create -}}
# Dedicated service account for the Spanner DDL migration Job. Bound via
# Workload Identity to a GCP service account with roles/spanner.databaseAdmin,
# keeping the main Deployment's service account at roles/spanner.databaseUser.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "platform-api-server.migrationServiceAccountName" . }}
  labels:
    {{- include "platform-api-server.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  {{- with .Values.spanner.migration.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
