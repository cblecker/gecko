{{- if .Values.spanner.enabled }}
# Spanner DDL migration Job. Runs at wave -5 alongside SpannerDatabase + IAM
# (per GCP-171 3-wave standard: -5 for infra, 0 for apps). Uses a dedicated service account with
# roles/spanner.databaseAdmin so the main Deployment only needs databaseUser.
#
# Migrations are idempotent (ensureTable checks existence, handles AlreadyExists).
# Replace=true allows ArgoCD to delete+recreate the Job when the spec changes
# (Jobs are immutable in Kubernetes).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "platform-api-server.fullname" . }}-migrate
  labels:
    {{- include "platform-api-server.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 3
  # Must exceed the in-process migration timeout (5 min) and cover all
  # backoffLimit retries: 5 min x 4 attempts = 20 min, plus headroom.
  activeDeadlineSeconds: 1500
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "platform-api-server.name" . }}-migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "platform-api-server.migrationServiceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --migrate-only
          env:
            - name: SPANNER_DATABASE
              value: {{ printf "projects/%s/instances/%s/databases/%s" .Values.spanner.projectId .Values.spanner.instanceId .Values.spanner.databaseId | quote }}
            {{- if .Values.spanner.tablePrefix }}
            - name: SPANNER_TABLE_PREFIX
              value: {{ .Values.spanner.tablePrefix | quote }}
            {{- end }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
