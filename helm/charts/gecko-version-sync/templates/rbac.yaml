{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gecko-version-sync.fullname" . }}
  labels:
    {{- include "gecko-version-sync.labels" . | nindent 4 }}
rules:
  - apiGroups: ["gcp.managed.openshift.io"]
    resources: ["versions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gcp.managed.openshift.io"]
    resources: ["channels"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gcp.managed.openshift.io"]
    resources: ["channels/status"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gecko-version-sync.fullname" . }}
  labels:
    {{- include "gecko-version-sync.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gecko-version-sync.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gecko-version-sync.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
