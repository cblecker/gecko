replicaCount: 1

image:
  registry: us-docker.pkg.dev
  repository: gcp-hcp-commons/gcp-hcp-images/gecko-controllers
  tag: ""
  pullPolicy: Always

nameOverride: ""
fullnameOverride: ""

orlopURL: ""
logLevel: info
logFormat: json

# Configure one catalog source for the whole environment. For CI, set type to
# release-controller and url to its architecture-specific base URL (without /graph).
# An empty Cincinnati source URL uses the legacy cincinnati.url setting below.
source:
  type: cincinnati
  url: ""

cincinnati:
  url: "https://api.openshift.com/api/upgrades_info/v1/graph"
  arch: amd64

# Channels define catalog membership from minimumSupportedVersion. Cincinnati
# probes <Channel name>-<major.minor>; release-controller discovers matching
# <major>-<Channel name> and <major>.<minor>.0-0.<Channel name> streams.
# The installation default stays pinned even when it is unavailable, and
# fleetMinorVersion independently controls automatic fleet upgrades.
# Example:
# channels:
#   stable:
#     minimumSupportedVersion: "4.22"
#     installDefaultVersion: "4.22.14"
#     fleetMinorVersion: "4.23"
channels: {}

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true

strategy:
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
  type: RollingUpdate

podSecurityContext:
  fsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podLabels: {}
imagePullSecrets: []
