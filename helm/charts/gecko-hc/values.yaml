replicaCount: 1

image:
  registry: us-docker.pkg.dev
  repository: gcp-hcp-commons/gcp-hcp-images/gecko-controllers
  tag: ""
  pullPolicy: Always

nameOverride: ""
fullnameOverride: ""

orlopURL: ""
logLevel: info

pullSecret:
  storeName: gcp-secret-manager
  gcpKey: default-openshift-pull-secret

# JSON-encoded customer-facing GCP resource labels (e.g., goog-partner-solution).
# Injected by ArgoCD from the cluster secret meta_customer_labels.
# Default to empty object if not provided.
customerLabels: "{}"

# JSON-encoded GCP Resource Manager tags from ArgoCD meta_resource_tags.
# Merged with Cluster.spec.platform.gcp.resourceTags on every reconciliation;
# configured tags win on duplicate keys. Keep this configuration stable for
# existing HostedClusters: HyperShift rejects changes to immutable resourceTags.
# Example: '[{"key":"redhat-managed","value":"true","parentID":"123456789"}]'
# Omit parentID to use the HostedCluster project. Empty list disables tags.
resourceTags: "[]"
logFormat: json
workers: 10

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true

strategy:
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
  type: RollingUpdate

podSecurityContext:
  fsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podLabels: {}
imagePullSecrets: []
