{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: signup-spa
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: marketplace-signup
    app.kubernetes.io/component: spa
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: marketplace-signup
    app.kubernetes.io/component: spa
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
