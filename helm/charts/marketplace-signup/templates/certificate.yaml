{{- if .Values.enabled }}
{{- if .Values.certificate.enabled }}
apiVersion: certificatemanager.cnrm.cloud.google.com/v1beta1
kind: CertificateManagerCertificate
metadata:
  name: {{ .Values.certificate.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: marketplace-signup
    app.kubernetes.io/component: certificate
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  location: global
  managed:
    domains:
      - {{ .Values.gateway.hostname }}
  # Without this, Config Connector resolves the project from the namespace and
  # fails with "Permission denied on resource project marketplace-signup".
  projectRef:
    external: {{ .Values.gcp.projectId }}
{{- end }}
{{- end }}
