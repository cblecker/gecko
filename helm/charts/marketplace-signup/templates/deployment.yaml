{{- if .Values.enabled }}
{{- include "marketplace-signup.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signup-backend
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: marketplace-signup
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: marketplace-signup
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marketplace-signup
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      # The backend reaches Google APIs through Workload Identity, where the GKE
      # metadata server obtains the Kubernetes token itself, and it never calls
      # the Kubernetes API, so the pod needs no mounted token.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            - name: OAUTH_CLIENT_ID
              value: {{ .Values.config.oauthClientId | quote }}
            - name: ALLOWED_EMAIL_DOMAINS
              value: {{ .Values.config.allowedEmailDomains | quote }}
            - name: ALLOWED_ORIGIN
              value: {{ .Values.config.allowedOrigin | quote }}
            - name: WORKFLOW_PROJECT_ID
              value: {{ .Values.config.workflowProjectId | quote }}
            - name: WORKFLOW_REGION
              value: {{ .Values.config.workflowRegion | quote }}
            - name: WORKFLOW_NAME
              value: {{ .Values.config.workflowName | quote }}
            - name: NOTIFY_INTEGRATION
              value: {{ .Values.config.notifyIntegration | quote }}
            - name: NOTIFY_PROJECT_ID
              value: {{ .Values.config.notifyProjectId | quote }}
            - name: NOTIFY_REGION
              value: {{ .Values.config.notifyRegion | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
{{- end }}
