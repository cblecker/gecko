{{- if .Values.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: marketplace-signup
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    # Workload Identity: the pod acts as this GSA. The environment's
    # infrastructure grants the matching principal:// binding and the roles the
    # backend needs (invoking activate-project and the notification integration).
    iam.gke.io/gcp-service-account: {{ .Values.serviceAccount.gcpServiceAccount | quote }}
{{- end }}
